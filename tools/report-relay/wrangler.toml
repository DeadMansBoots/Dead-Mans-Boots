name = "dmb-reports"
main = "worker.js"
compatibility_date = "2026-10-01"

# The reports are kept in a Workers KV namespace (free plan: 25 MiB a value, 1 GB, 1,000 writes a day). Make it once with `npx wrangler kv namespace create REPORTS`
# and put the id it prints here; the line below is the one to fill in.
[[kv_namespaces]]
binding = "REPORTS"
id = "REPLACE_WITH_THE_NAMESPACE_ID"

# Rate limit (deploys from the command line only): five reports a minute from one address (Cloudflare calls the count approximate)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

# READ_SECRET is a secret: a random text that fetch_reports.py sends to read and delete reports. Set it with:  npx wrangler secret put READ_SECRET   (never written in this file)
